[package]
name = "sounddeck"
version = "0.1.0"
edition = "2024"
default-run = "sounddeck"
rust-version = "1.85"
description = "Now-playing media controls on the Windows taskbar"
license = "MIT"
repository = "https://github.com/d1m40fficial/SoundDeck"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows-future = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Media_Core",
    "Media_Playback",

    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",

    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",

    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
